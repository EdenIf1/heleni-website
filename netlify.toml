# Netlify builds the site from nagariyat-haleni-demo.html on every push to main.
[build]
  command = "node build.mjs"
  publish = "site"
  # Skip the deploy (and its credits) when a push changes nothing that ends up on the site,
  # e.g. only README.md or CLAUDE.md. Exit 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- nagariyat-haleni-demo.html images/ og-image.jpg build.mjs netlify.toml site/fonts/"

[build.environment]
  NODE_VERSION = "20"
