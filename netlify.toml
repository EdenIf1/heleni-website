# SITE IS OFFLINE (owner's request, 2026-11-13): Netlify publishes only the "coming back soon" page in offline/.
# To bring the full site back, restore these two lines:
#   command = "node build.mjs"
#   publish = "site"
[build]
  command = "echo offline"
  publish = "offline"
  # Skip the deploy (and its credits) when a push changes nothing that ends up on the site,
  # e.g. only README.md or CLAUDE.md. Exit 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- nagariyat-haleni-demo.html images/ og-image.jpg build.mjs netlify.toml site/fonts/ offline/"

[build.environment]
  NODE_VERSION = "20"
